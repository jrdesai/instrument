# Cloudflare Pages configuration.
#
# `public/wasm-pkg/` is gitignored — it is produced by `pnpm run build:wasm` and
# copied into `dist/wasm-pkg/` by Vite. A web build that runs **only** Vite without
# compiling WASM first deploys a broken app (dynamic import of instrument_web.js
# gets HTML → "text/html is not a valid JavaScript MIME type").
#
# Recommended: deploy from GitHub Actions (see .github/workflows/ci.yml) which runs
# build:wasm then vite build, then `wrangler pages deploy dist`.
#
# If Cloudflare Pages builds from Git instead, use a build command that includes WASM,
# for example (Ubuntu image; adjust for your Pages environment):
#
#   curl -sSf https://sh.rustup.rs | sh -s -- -y
#   . "$HOME/.cargo/env"
#   rustup target add wasm32-unknown-unknown
#   curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
#   pnpm install --frozen-lockfile
#   pnpm run build:web
#
# Output directory: dist
#
# Do **not** use `pnpm exec vite build --mode web` alone — it skips WASM compilation.

name = "instrument"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"
